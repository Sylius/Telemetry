name: Build

on:
    push: ~
    pull_request: ~
    workflow_dispatch: ~

jobs:
    unit:
        name: "Unit (PHP ${{ matrix.php }}${{ matrix.prefer_lowest && ' lowest' || '' }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   php: "8.1"
                        prefer_lowest: true
                    -   php: "8.2"
                    -   php: "8.3"
                    -   php: "8.4"
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    coverage: none
                    tools: composer:v2

            -   name: Install dependencies
                run: |
                    if [ "${{ matrix.prefer_lowest }}" = "true" ]; then
                        composer update --no-interaction --prefer-dist --no-progress --prefer-lowest --prefer-stable
                    else
                        composer install --no-interaction --prefer-dist --no-progress
                    fi

            -   name: Run unit tests
                run: vendor/bin/phpunit tests/Unit

    integration:
        name: "Integration (PHP ${{ matrix.php }}, Sf ${{ matrix.symfony }}, Sylius ${{ matrix.sylius }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Sylius 1.14 (Symfony 6.4)
                    -   php: "8.2"
                        symfony: "6.4"
                        sylius: "~1.14.0"
                    -   php: "8.3"
                        symfony: "6.4"
                        sylius: "~1.14.0"
                    -   php: "8.4"
                        symfony: "6.4"
                        sylius: "~1.14.0"

                    # Sylius 2.0 (Symfony 7.4)
                    -   php: "8.2"
                        symfony: "7.4"
                        sylius: "~2.0.0"
                    -   php: "8.3"
                        symfony: "7.4"
                        sylius: "~2.0.0"

                    # Sylius 2.1 (Symfony 7.4)
                    -   php: "8.3"
                        symfony: "7.4"
                        sylius: "~2.1.0"
                    -   php: "8.4"
                        symfony: "7.4"
                        sylius: "~2.1.0"

                    # Sylius 2.2 (Symfony 7.4)
                    -   php: "8.4"
                        symfony: "7.4"
                        sylius: "~2.2.0"
                    -   php: "8.5"
                        symfony: "7.4"
                        sylius: "~2.2.0"

        steps:
            -   uses: actions/checkout@v4

            -   name: Build test application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    build_type: "plugin"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-sylius-${{ matrix.sylius }}-"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-sylius-${{ matrix.sylius }}-"
                    e2e: "yes"
                    php_version: "${{ matrix.php }}"
                    symfony_version: "${{ matrix.symfony }}"
                    sylius_version: "${{ matrix.sylius }}"
                    database: "mysql:8.4"

            -   name: Run PHPUnit
                run: vendor/bin/phpunit
